spring:
  application:
    name: only-flans-api

  # Configuración de base de datos
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  # Hibernate: valida el esquema contra tus entidades
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# Variables de entorno para las APIs externas
api:
  mercadopago:
    access-token: ${MP_ACCESS_TOKEN}
    webhook-secret: ${MP_WEBHOOK_SECRET}
  whatsapp:
    token: ${WA_TOKEN}
    verify-token: ${WA_VERIFY_TOKEN}